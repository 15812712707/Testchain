{% extends 'base.html' %}
{% block content %}<div class="heading"><h1>操作日志</h1></div><section class="panel table-panel"><table><thead><tr><th>时间</th><th>操作人</th><th>操作内容</th></tr></thead><tbody>{% for event in page_obj %}<tr><td>{{ event.created_at|date:'Y-m-d H:i:s' }}</td><td>{{ event.actor.username|default:'已移除用户' }}</td><td>{{ event.action }}</td></tr>{% empty %}<tr><td colspan="3" class="empty">暂无记录。</td></tr>{% endfor %}</tbody></table></section>{% include 'pagination.html' %}{% endblock %}
