{% extends 'base.html' %}
{% block content %}
<div class="heading"><h1>{{ title }}</h1></div>
<section class="panel form-panel">
<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}
<div class="actions"><button class="button" type="submit">保存</button><a class="button secondary" href="{% if project %}{% url 'project' project.id %}{% else %}{% url 'dashboard' %}{% endif %}">返回</a></div>
</form></section>
{% endblock %}
