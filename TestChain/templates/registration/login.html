{% extends 'base.html' %}
{% block content %}
<section class="auth-card panel"><span class="eyebrow">WELCOME TO TESTCHAIN</span><h1>登录工作台</h1><p class="muted">管理测试流程，保存可核验的报告。</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ request.GET.next }}"><button class="button full">登录</button></form>
{% if registration_open %}<p class="muted">还没有账号？<a href="{% url 'register' %}">注册账号</a></p>{% endif %}</section>
{% endblock %}
